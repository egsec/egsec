name: Update README cards
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: bash scripts/fetch_contributions.sh
      - name: Render cards
        run: python3 scripts/render_readme_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update cards" && git push)
